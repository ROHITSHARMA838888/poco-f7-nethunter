name: Build Archer TX tasklet type fix with KCFI retained
on:
  push:
    branches: [codex/rom-symbol-baseline]
    paths:
      - .github/workflows/rom-archer-tx-tasklet-fix.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: rom-archer-tx-tasklet-fix
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ROM_PROBE_TOOLCHAIN_SCOPE: Official apt LLVM 22 root/adapter candidate, not exact ROM Android Clang r596125
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download already-built root candidate metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rom-root-adapter-symbol-evidence
          run-id: 41207879867
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inherited-evidence
      - name: Install official LLVM 22 and matching BTF tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg build-essential flex bison libssl-dev libelf-dev bc dwarves python3
          curl -fsSLo /tmp/llvm-signing-key.asc https://apt.llvm.org/llvm-snapshot.gpg.key
          fingerprint=$(gpg --show-keys --with-colons /tmp/llvm-signing-key.asc | awk -F: '$1 == "fpr" {print $10; exit}')
          test "$fingerprint" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          gpg --dearmor < /tmp/llvm-signing-key.asc | sudo tee /usr/share/keyrings/llvm22.gpg > /dev/null
          echo 'deb [signed-by=/usr/share/keyrings/llvm22.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/llvm22.list
          sudo apt-get update
          sudo apt-get install -y clang-22 lld-22 llvm-22 kmod rsync
      - name: Fetch exact ROM kernel source
        shell: bash
        run: |
          set -euo pipefail
          git init rom-kernel
          git -C rom-kernel remote add origin https://github.com/xiaomi-onyx-playground/android_kernel_xiaomi_sm8735.git
          git -C rom-kernel fetch --depth=1 origin 7750565ada3d57e195798519b005d2b038e888c1
          git -C rom-kernel checkout --detach FETCH_HEAD
          test "$(git -C rom-kernel rev-parse HEAD)" = 7750565ada3d57e195798519b005d2b038e888c1
      - name: Integrate pinned KernelSU Next
        shell: bash
        run: |
          set -euo pipefail
          git init rom-kernel/.root_modules/KernelSU-Next
          git -C rom-kernel/.root_modules/KernelSU-Next remote add origin https://github.com/KernelSU-Next/KernelSU-Next.git
          git -C rom-kernel/.root_modules/KernelSU-Next fetch origin b427a3f9c2421a443f961007bfce66b25486643f
          git -C rom-kernel/.root_modules/KernelSU-Next checkout --detach FETCH_HEAD
          test "$(git -C rom-kernel/.root_modules/KernelSU-Next rev-parse HEAD)" = b427a3f9c2421a443f961007bfce66b25486643f
          ln -s ../.root_modules/KernelSU-Next/kernel rom-kernel/drivers/kernelsu
          python3 compatibility/wire_rom_root.py
          git -C rom-kernel diff --check
          git -C rom-kernel diff --exit-code -- kernel/module/
      - name: Prepare exact running headers and dependency CRC table
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rom-kernel/out archer-evidence
          cp inherited-evidence/resolved.config rom-kernel/out/.config
          cp rom-kernel/out/.config archer-evidence/resolved.config
          clang-22 --version | tee archer-evidence/compiler.txt
          make -C rom-kernel -j"$(nproc)" O=out ARCH=arm64 LLVM=-22 modules_prepare 2>&1 | tee archer-evidence/prepare.log
          cmp rom-kernel/out/.config archer-evidence/resolved.config
          test "$(cat rom-kernel/out/include/config/kernel.release)" = 6.6.142-4k-g7750565ada3d-dirty
          cp inherited-evidence/Module.symvers rom-kernel/out/Module.symvers
          cp inherited-evidence/Module.symvers archer-evidence/Module.symvers
      - name: Build pinned Archer with strict callback-cast diagnostics
        shell: bash
        run: |
          set -euo pipefail
          source drivers.lock
          mkdir external
          git init external/rtl8812au
          git -C external/rtl8812au remote add origin "$RTL8812AU_REPOSITORY"
          git -C external/rtl8812au fetch --depth=1 origin "$RTL8812AU_COMMIT"
          git -C external/rtl8812au checkout --detach FETCH_HEAD
          test "$(git -C external/rtl8812au rev-parse HEAD)" = "$RTL8812AU_COMMIT"
          python3 compatibility/prepare_rom_driver.py external/rtl8812au
          python3 audit/prepare_archer_tx_tasklet_fix.py external/rtl8812au
          python3 - <<'PY_AUDIT'
          from pathlib import Path
          p=Path('external/rtl8812au/Makefile')
          p.write_text(p.read_text()+'\n# Audit diagnostics only; retain runtime KCFI/KASAN.\nEXTRA_CFLAGS += -Wcast-function-type-strict -Werror=cast-function-type-strict\n')
          PY_AUDIT
          git -C external/rtl8812au diff --check
          git -C external/rtl8812au diff > archer-evidence/source-fixes.patch
          build=(make V=1 -j"$(nproc)" -C rom-kernel O=out ARCH=arm64 LLVM=-22
            M="$GITHUB_WORKSPACE/external/rtl8812au"
            CONFIG_88XXAU=m CONFIG_PLATFORM_I386_PC=n CONFIG_RTW_DEBUG=y
            USER_EXTRA_CFLAGS="-DCONFIG_LITTLE_ENDIAN -DCONFIG_IOCTL_CFG80211 -DRTW_USE_CFG80211_STA_EVENT")
          "${build[@]}" core/rtw_recv.o 2>&1 | tee archer-evidence/recv-preflight.log
          "${build[@]}" modules 2>&1 | tee archer-evidence/build.log
          file=external/rtl8812au/88XXau.ko
          test "$(modinfo -F name "$file")" = 88XXau
          test "$(modinfo -F vermagic "$file" | cut -d' ' -f1)" = 6.6.142-4k-g7750565ada3d-dirty
          modinfo -F parm "$file" | grep '^rtw_drv_log_level:'
          modinfo -F alias "$file" | grep -i 'usb:v2357p0120'
          modinfo "$file" > archer-evidence/modinfo.txt
          llvm-readelf-22 -h "$file" | tee archer-evidence/elf-header.txt
          grep -q 'Machine:.*AArch64' archer-evidence/elf-header.txt
          for symbol in CFI_CLANG KASAN_HW_TAGS; do
            grep -qx "CONFIG_${symbol}=y" rom-kernel/out/.config
          done
          llvm-readelf-22 -SW "$file" > archer-evidence/elf-sections.txt
          llvm-nm-22 -an "$file" > archer-evidence/module-symbols.txt
          modprobe --dump-modversions "$file" > archer-evidence/imported-versions.txt
          python3 audit/report_archer_cfi_audit.py --require-clean-callbacks
      - name: Stage statically verified module for review only
        shell: bash
        run: |
          set -euo pipefail
          mkdir archer-candidate
          cp external/rtl8812au/88XXau.ko archer-candidate/
          (cd archer-candidate && sha256sum 88XXau.ko > SHA256SUMS)
          printf '%s\n' 'CANDIDATE ONLY: TX tasklet type repair. KCFI retained.' \
            'No phone load or reboot/injection qualification performed.' \
            'Not a flashable kernel ZIP. Preserve the installed driver and boot backups.' \
            > archer-candidate/README.txt
      - name: Retain review candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: onyx-archer-tx-tasklet-fix-CANDIDATE-NOT-INSTALLED
          path: archer-candidate/
          if-no-files-found: error
      - name: Retain compiler and ABI audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: onyx-archer-tx-tasklet-fix-evidence
          path: archer-evidence/
          if-no-files-found: error
