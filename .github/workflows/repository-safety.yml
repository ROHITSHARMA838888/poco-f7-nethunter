name: Repository safety
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repo-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  safety:
    name: Repository safety
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check syntax and workflow security
        run: python3 .github/scripts/check_repository.py
