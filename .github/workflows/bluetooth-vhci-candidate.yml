name: Build isolated Bluetooth VHCI candidate
on:
  push:
    branches: [codex/bluetooth-vhci-candidate]
    paths: [.github/workflows/bluetooth-vhci-candidate.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: bluetooth-vhci-candidate
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ROM_PROBE_TOOLCHAIN_SCOPE: Official apt LLVM 22 root/adapter candidate, not exact ROM Android Clang r596125
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download already-built root candidate metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rom-root-adapter-symbol-evidence
          run-id: 41207879867
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inherited-evidence
      - name: Install official LLVM 22 and matching BTF tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg build-essential flex bison libssl-dev libelf-dev bc dwarves python3
          curl -fsSLo /tmp/llvm-signing-key.asc https://apt.llvm.org/llvm-snapshot.gpg.key
          fingerprint=$(gpg --show-keys --with-colons /tmp/llvm-signing-key.asc | awk -F: '$1 == "fpr" {print $10; exit}')
          test "$fingerprint" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          gpg --dearmor < /tmp/llvm-signing-key.asc | sudo tee /usr/share/keyrings/llvm22.gpg > /dev/null
          echo 'deb [signed-by=/usr/share/keyrings/llvm22.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/llvm22.list
          sudo apt-get update
          sudo apt-get install -y clang-22 lld-22 llvm-22 kmod rsync
      - name: Fetch exact ROM kernel source
        shell: bash
        run: |
          set -euo pipefail
          git init rom-kernel
          git -C rom-kernel remote add origin https://github.com/xiaomi-onyx-playground/android_kernel_xiaomi_sm8735.git
          git -C rom-kernel fetch --depth=1 origin 7750565ada3d57e195798519b005d2b038e888c1
          git -C rom-kernel checkout --detach FETCH_HEAD
          test "$(git -C rom-kernel rev-parse HEAD)" = 7750565ada3d57e195798519b005d2b038e888c1
      - name: Integrate pinned KernelSU Next
        shell: bash
        run: |
          set -euo pipefail
          git init rom-kernel/.root_modules/KernelSU-Next
          git -C rom-kernel/.root_modules/KernelSU-Next remote add origin https://github.com/KernelSU-Next/KernelSU-Next.git
          git -C rom-kernel/.root_modules/KernelSU-Next fetch origin b427a3f9c2421a443f961007bfce66b25486643f
          git -C rom-kernel/.root_modules/KernelSU-Next checkout --detach FETCH_HEAD
          test "$(git -C rom-kernel/.root_modules/KernelSU-Next rev-parse HEAD)" = b427a3f9c2421a443f961007bfce66b25486643f
          ln -s ../.root_modules/KernelSU-Next/kernel rom-kernel/drivers/kernelsu
          python3 compatibility/wire_rom_root.py
          git -C rom-kernel diff --check
          git -C rom-kernel diff --exit-code -- kernel/module/
      - name: Prepare exact running headers and dependency CRC table
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rom-kernel/out vhci-evidence
          cp inherited-evidence/resolved.config rom-kernel/out/.config
          cp rom-kernel/out/.config vhci-evidence/resolved.config
          clang-22 --version | tee vhci-evidence/compiler.txt
          make -C rom-kernel -j"$(nproc)" O=out ARCH=arm64 LLVM=-22 modules_prepare 2>&1 | tee vhci-evidence/prepare.log
          cmp rom-kernel/out/.config vhci-evidence/resolved.config
          test "$(cat rom-kernel/out/include/config/kernel.release)" = 6.6.142-4k-g7750565ada3d-dirty
          cp inherited-evidence/Module.symvers rom-kernel/out/Module.symvers
          cp inherited-evidence/Module.symvers vhci-evidence/Module.symvers
      - name: Build isolated exact-source VHCI module
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external/vhci verified-vhci
          cp rom-kernel/drivers/bluetooth/hci_vhci.c external/vhci/
          printf 'obj-m += hci_vhci.o\n' > external/vhci/Makefile
          make -C rom-kernel O=out ARCH=arm64 LLVM=-22 M="$GITHUB_WORKSPACE/external/vhci" modules 2>&1 | tee vhci-evidence/build.log
          ko=external/vhci/hci_vhci.ko
          llvm-readelf-22 -h "$ko" | grep 'Machine:.*AArch64'
          test "$(modinfo -F vermagic "$ko" | cut -d' ' -f1)" = 6.6.142-4k-g7750565ada3d-dirty
          modprobe --show-modversions "$ko" > vhci-evidence/imported-crcs.txt
          python3 - <<'PY_CHECK'
          from pathlib import Path
          table={p[1]:int(p[0],16) for l in Path('inherited-evidence/Module.symvers').read_text().splitlines() if len(p:=l.split())>=2}
          imports=[l.split() for l in Path('vhci-evidence/imported-crcs.txt').read_text().splitlines()]
          assert imports
          for crc,name in imports:
              assert name in table and int(crc,16)==table[name], name
          print(f'All {len(imports)} imported CRCs match the tested kernel build')
          PY_CHECK
          modinfo "$ko" > vhci-evidence/modinfo.txt
          cp "$ko" verified-vhci/
          sha256sum "$ko" > vhci-evidence/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isolated-vhci-candidate-NOT-INSTALLED
          path: |
            verified-vhci/
            vhci-evidence/
